<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async JS | setInterval</title>
</head>
<body style="background-color: #212121; color: #fff;">
    <h1>Chai aur JavaScript</h1>
    <button id="start">Start</button>
    <button id="stop">Stop</button>

    <script>
        // The core reference function taught by Hitesh
        const sayDate = function(str){
            console.log(str, Date.now());
        }

        let intervalId;

        // Start button handler to spin up the interval safely
        document.querySelector('#start').addEventListener('click', function(){
            if(!intervalId){
                intervalId = setInterval(sayDate, 1000, "Chai");
            }
        });

        // Stop button handler to clear the active interval sequence
        document.querySelector('#stop').addEventListener('click', function(){
            clearInterval(intervalId);
            intervalId = null; // Flushes the variable out of memory
            console.log("Interval Stopped");
        });
    </script>
</body>
</html>
