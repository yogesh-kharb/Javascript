<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM | Chai aur Code</title>
</head>
<body style="background-color: #212121; color: #ffff;">
    <div class="parent">
        <div class="day">Monday</div>
        <div class="day">Tuesday</div>
        <div class="day">Wednesday</div>
        <div class="day">Thursday</div>
    </div>
</body>
<script>
    const par = document.querySelector('.parent');
    // console.log(par);
    // console.log(par.children[0].innerHTML);

    // for(let i = 0 ; i < par.children.length ; i ++){
    //     console.log(par.children[i].innerHTML);
    // }
    par.children[1].style.color = 'orange';
    console.log(par.firstElementChild);
    console.log(par.lastElementChild);

    const dayOne = document.querySelector('.day');
    console.log(dayOne.parentElement);
    dayOne.parentElement.style.backgroundColor = 'red';
    const dayTwo = dayOne.nextElementSibling;
    dayTwo.style.color = 'green';

    console.log("Nodes: " , par.childNodes);
</script>
</html>
