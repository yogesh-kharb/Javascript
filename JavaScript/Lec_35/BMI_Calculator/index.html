<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI CALCULATOR</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <div id="calculator_card">
        <h1>BMI CALCULATOR</h1>
        <input id = "wt" class="inp" placeholder="Enter weight in kg"></input>
        <input id = "hi" class="inp" placeholder="Enter height in cm"></input>
        <div id="ans" class="op"></div>
        <h2 id="msg" class="op">BMI of normal human lies b/w 18.5 to 24.9</h2>
        <div id="suggestion" class="op"></div>
        <button id="submit" type="submit">Submit</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
