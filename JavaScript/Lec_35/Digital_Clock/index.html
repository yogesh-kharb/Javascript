<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
        <div id="display">
            <span id="time">12:00:00</span>
            <span id="ampm">AM</span>
            <div id="date">Sunday, 11 October 2026</div>
        </div>
        <div id="menu">
            <button id="half">12 hours</button>
            <button id="full">24 hours</button>
            <button id="displaydate">Show date</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
